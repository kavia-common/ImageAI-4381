version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imageai_backend
    env_file:
      - ./.env
    environment:
      # PUBLIC_INTERFACE
      # The directory inside the container where models will be stored/mounted.
      MODEL_DIR: /app/app/data/models
      # PUBLIC_INTERFACE
      # Comma-separated list of origins allowed for CORS, e.g., http://localhost:5173
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:5173}
      # Optional: set device/cuda flags via env as needed by backend/app/core/devices.py (if supported)
    volumes:
      # Map local data and models into the container for persistence and dev convenience
      - ./data:/app/app/data
      - ./models:/app/app/data/models
    ports:
      - "8000:8000"
    # Ensure backend waits for its container network to be ready
    networks:
      - appnet
    # Dev command: prefer running uvicorn with reload if Dockerfile supports it; otherwise rely on Dockerfile CMD
    command: >
      sh -c "python -m uvicorn app.main:app
      --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imageai_frontend
    env_file:
      - ./.env
    environment:
      # PUBLIC_INTERFACE
      # Base URL for the backend API used by Vite at build/runtime.
      # The default points to the compose service name 'backend' on port 8000.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8000}
      # Ensure Vite binds to all interfaces inside container for external access
      VITE_HOST: 0.0.0.0
    volumes:
      # Mount source for live reload during development
      - ./frontend:/app
      # Preserve node_modules inside container to avoid host/container platform conflicts
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - appnet
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

networks:
  appnet:
    driver: bridge

volumes:
  # Named volumes can be added later if needed; using bind mounts above for dev.
  # Keeping section for easy future extension.
